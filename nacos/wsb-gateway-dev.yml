server:
  port: 8080

spring:
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
      routes:
        - id: wsb-user
          uri: lb://wsb-user
          predicates:
            - Path=/v1/admin/login,/v1/admin/logout,/v1/admin/user/**,/v1/admin/register,/v1/admin/passwd,/v1/admin/phone/**
        - id: wsb-book
          uri: lb://wsb-book
          predicates:
            - Path=/v1/book/**,/v1/shelf/**,/v1/bookshelf/**,/v1/isbn/**,/v1/collect/**
        - id: wsb-community
          uri: lb://wsb-community
          predicates:
            - Path=/v1/group/**,/v1/community/**
        - id: wsb-file
          uri: lb://wsb-file
          predicates:
            - Path=/v1/picture/**
        - id: wsb-rag
          uri: lb://wsb-rag
          predicates:
            - Path=/v1/rag/**

        - id: wsb-user-swagger
          uri: lb://wsb-user
          predicates:
            - Path=/wsb-user/v3/api-docs
          filters:
            - RewritePath=/wsb-user/v3/api-docs, /v3/api-docs
        - id: wsb-book-swagger
          uri: lb://wsb-book
          predicates:
            - Path=/wsb-book/v3/api-docs
          filters:
            - RewritePath=/wsb-book/v3/api-docs, /v3/api-docs
        - id: wsb-community-swagger
          uri: lb://wsb-community
          predicates:
            - Path=/wsb-community/v3/api-docs
          filters:
            - RewritePath=/wsb-community/v3/api-docs, /v3/api-docs
        - id: wsb-file-swagger
          uri: lb://wsb-file
          predicates:
            - Path=/wsb-file/v3/api-docs
          filters:
            - RewritePath=/wsb-file/v3/api-docs, /v3/api-docs
        - id: wsb-rag-swagger
          uri: lb://wsb-rag
          predicates:
            - Path=/wsb-rag/v3/api-docs
          filters:
            - RewritePath=/wsb-rag/v3/api-docs, /v3/api-docs

knife4j:
  gateway:
    enabled: true
    strategy: manual
    routes:
      - name: 用户服务
        url: /wsb-user/v3/api-docs
        service-name: wsb-user
        order: 1
      - name: 图书服务
        url: /wsb-book/v3/api-docs
        service-name: wsb-book
        order: 2
      - name: 社区服务
        url: /wsb-community/v3/api-docs
        service-name: wsb-community
        order: 3
      - name: 文件服务
        url: /wsb-file/v3/api-docs
        service-name: wsb-file
        order: 4
      - name: RAG服务
        url: /wsb-rag/v3/api-docs
        service-name: wsb-rag
        order: 5

sa-token:
  token-name: satoken
  timeout: 2592000
  active-timeout: -1
  is-concurrent: true
  is-share: true
  token-style: uuid
  is-log: false
  jwt-secret-key: ${SA_TOKEN_JWT_SECRET:wsbbackendsecretkeywsbbackendsecretkey32bits}

